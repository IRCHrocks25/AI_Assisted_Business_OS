<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Assisted Business OS{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-base': '#0B0F19',
                        'dark-1': '#111827',
                        'dark-2': '#1A2236',
                        'dark-3': '#1F2937',
                        'blue-electric': '#2563EB',
                        'blue-bright': '#3B82F6',
                        'blue-light': '#38BDF8',
                        'blue-accent': '#0EA5E9',
                        'pink-neon': '#EC4899',
                        'purple-neon': '#D946EF',
                        'pink-light': '#F472B6',
                        'purple-dark': '#C026D3',
                        'violet': '#7C3AED',
                        'violet-light': '#8B5CF6',
                        'text-light': '#F8FAFC',
                        'text-mid': '#CBD5E1',
                        'text-gray': '#94A3B8',
                        'text-dark': '#64748B',
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" />
    
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            background: linear-gradient(135deg, #0B0F19 0%, #111827 50%, #1A2236 100%);
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(26, 34, 54, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-blue {
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
        }
        .glow-pink {
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
        }
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="text-text-light antialiased">
    {% block content %}{% endblock %}
    
    <!-- AI Chatbot -->
    {% include 'components/_chatbot.html' %}
    
    <script>
        // Process catalogue cards - split comma-separated strings into lists
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.catalogue-card');
            cards.forEach(card => {
                // Process tags
                const tags = card.getAttribute('data-tags');
                if (tags) {
                    const tagsContainer = card.querySelector('.catalogue-tags');
                    if (tagsContainer) {
                        tags.split(',').forEach(tag => {
                            const chip = document.createElement('span');
                            chip.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-dark-2 text-text-mid border border-text-dark/30';
                            chip.textContent = tag.trim();
                            tagsContainer.appendChild(chip);
                        });
                    }
                }
                
                // Process use cases
                const useCases = card.getAttribute('data-use-cases');
                if (useCases) {
                    const useCasesContainer = card.querySelector('.catalogue-use-cases');
                    if (useCasesContainer) {
                        useCases.split(',').forEach(case_ => {
                            const li = document.createElement('li');
                            li.className = 'text-sm text-text-mid flex items-start';
                            li.innerHTML = '<i class="fas fa-check-circle text-blue-electric mr-2 mt-0.5"></i><span>' + case_.trim() + '</span>';
                            useCasesContainer.appendChild(li);
                        });
                    }
                }
                
                // Process includes
                const includes = card.getAttribute('data-includes');
                if (includes) {
                    const includesContainer = card.querySelector('.catalogue-includes');
                    if (includesContainer) {
                        includes.split(',').forEach(item => {
                            const li = document.createElement('li');
                            li.className = 'text-sm text-text-mid flex items-start';
                            li.innerHTML = '<i class="fas fa-circle text-pink-neon mr-2 mt-1 text-xs"></i><span>' + item.trim() + '</span>';
                            includesContainer.appendChild(li);
                        });
                    }
                }
            });
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
