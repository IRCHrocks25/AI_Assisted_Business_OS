<div class="mb-6">
  <div class="flex items-center gap-3">
    <div class="shrink-0">
      <span class="inline-flex items-center justify-center w-10 h-10 rounded-lg {% if accent == 'pink' %}bg-pink-neon/10{% else %}bg-blue-electric/10{% endif %}">
        <i class="fas {{ icon }} {% if accent == 'pink' %}text-pink-neon{% else %}text-blue-electric{% endif %} text-base"></i>
      </span>
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="text-xl font-bold text-text-light leading-tight tracking-tight">{{ title }}</h3>
    </div>
  </div>
</div>
