<style>
  .official-footer {
    background: #060608;
    color: #fff;
    padding: 60px 0 0;
  }
  .official-footer-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px 60px;
  }
  .official-footer-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr 1fr;
    gap: 40px;
  }
  .official-footer-brand {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .official-footer-logo {
    display: inline-block;
  }
  .official-footer-logo img {
    height: 28px;
    width: auto;
  }
  .official-footer-muted {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.35);
    line-height: 1.6;
  }
  .official-footer-status {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .official-footer-status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    display: inline-block;
  }
  .official-footer-social {
    display: flex;
    gap: 10px;
  }
  .official-footer-social a {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.45);
    text-decoration: none;
    font-size: 13px;
  }
  .official-footer-col-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.25);
    margin-bottom: 16px;
  }
  .official-footer-col-links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .official-footer-col-links a {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.55);
    text-decoration: none;
  }
  .official-footer-col-links a:hover {
    color: #fff;
  }
  .official-footer-bottom-wrap {
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding: 20px 32px;
  }
  .official-footer-bottom {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .official-footer-copy {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.25);
  }
  .official-footer-cta {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.45);
    text-decoration: none;
  }
  @media (max-width: 980px) {
    .official-footer-inner {
      padding: 0 20px 44px;
    }
    .official-footer-grid {
      grid-template-columns: 1fr 1fr;
      gap: 28px 24px;
    }
    .official-footer-bottom-wrap {
      padding: 16px 20px;
    }
  }
  @media (max-width: 640px) {
    .official-footer {
      padding-top: 44px;
    }
    .official-footer-inner {
      padding: 0 16px 34px;
    }
    .official-footer-grid {
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .official-footer-bottom-wrap {
      padding: 14px 16px 18px;
    }
    .official-footer-bottom {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
  }
</style>

<footer class="official-footer" {% if footer_no_border_top %}style="border-top:none;"{% endif %}>
  <div class="official-footer-inner">
    <div class="official-footer-grid">
      <div class="official-footer-brand">
        <a href="{% url 'home' %}" class="logo official-footer-logo">
          <img src="https://res.cloudinary.com/dcuswyfur/image/upload/v1776795634/katek_logo_white_p1evh7.svg" alt="KATEK AI" />
        </a>
        <p class="official-footer-muted">We handle the AI.<br>You run the business.</p>
        <div class="official-footer-status">
          <span class="official-footer-status-dot"></span>
          <span class="official-footer-muted" style="font-size:12px;">All systems operational</span>
        </div>
      </div>

      <div>
        <div class="official-footer-col-title">Products</div>
        <div class="official-footer-col-links">
          <a href="{% url 'business_os' %}">AI Business OS</a>
          <a href="{% url 'ikonik' %}">Ikonik</a>
          <a href="{% url 'enterprise' %}">Enterprise Solutions</a>
          <a href="{% url 'education' %}">Education &amp; Training</a>
        </div>
      </div>

      <div>
        <div class="official-footer-col-title">Company</div>
        <div class="official-footer-col-links">
          <a href="{% url 'home' %}#why">Why KATEK</a>
          <a href="{% url 'home' %}#how">How It Works</a>
          <a href="{% url 'blog_list' %}">Insights</a>
          <a href="{% url 'home' %}#faq">FAQ</a>
        </div>
      </div>

      <div>
        <div class="official-footer-col-title">Legal</div>
        <div class="official-footer-col-links">
          <a href="{% url 'privacy_policy' %}">Privacy Policy</a>
          <a href="{% url 'terms_and_conditions' %}">Terms &amp; Conditions</a>
          <a href="#" onclick="if(window.Cookiebot){Cookiebot.renew();return false;}">Cookie Policy</a>
        </div>
      </div>
    </div>
  </div>

  <div class="official-footer-bottom-wrap">
    <div class="official-footer-bottom">
      <span class="official-footer-copy">© 2026 KATEK AI. All rights reserved.</span>
      <a class="official-footer-cta" href="https://l.katalyst-crm.com/widget/booking/SN4ObXvI69KyDZs9jMd2?event_id=LQaRPG83gbExdXkxhead" target="_blank" rel="noopener noreferrer">Book a Discovery Call →</a>
    </div>
  </div>
</footer>
